[project]
name = "uml-viewer-python"
version = "0.1.0"
description = "Python language support and a Claude companion for unclebob/uml-viewer"
requires-python = ">=3.11"
dependencies = ["radon>=6.0"]

[project.scripts]
umlpy = "umlpy.cli:main"
umlpy-companion = "umlpy.companion:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umlpy"]

[tool.ruff]
line-length = 120
